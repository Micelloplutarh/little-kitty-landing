<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>little_kitty</title>
  <meta name="theme-color" content="#0d0a12">
  <link rel="preload" as="image" href="img/bg.jpg">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;800&display=swap">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;overflow-x:hidden}
    body{
      min-height:100dvh;background:#0d0a12;
      display:flex;justify-content:center;
      font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    /* Экран: на десктопе — колонка шириной с телефон по центру */
    .screen{
      position:relative;width:100%;max-width:430px;min-height:100dvh;
      display:flex;flex-direction:column;overflow:hidden;
    }

    /* Фото + затемнение снизу под текст */
    .photo{
      position:absolute;inset:0;z-index:0;
      background:center 20%/cover no-repeat;
      animation:zoomOut 7s ease-out both;
    }
    @keyframes zoomOut{from{transform:scale(1.06)}to{transform:scale(1)}}
    .shade{
      position:absolute;inset:0;z-index:1;
      background:
        radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(0,0,0,.35) 100%),
        linear-gradient(to bottom,rgba(0,0,0,.12) 0%,transparent 40%,rgba(13,10,18,.6) 66%,rgba(13,10,18,.97) 100%);
    }

    /* Плашка «входящее сообщение» */
    .msg{
      position:relative;z-index:2;align-self:flex-start;
      margin:20px 16px 0;padding:9px 16px 9px 9px;max-width:260px;
      display:flex;align-items:center;gap:10px;
      background:rgba(255,255,255,.95);border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      opacity:0;animation:popIn .5s cubic-bezier(.3,1.5,.6,1) .7s forwards;
    }
    @keyframes popIn{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
    .msg__pic{position:relative;flex:none;width:42px;height:42px}
    .msg__pic img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #ffd6e6}
    .msg__online{
      position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;
      background:#2ecc71;border:2px solid #fff;
      animation:online 2.2s ease-in-out 1.4s infinite;
    }
    @keyframes online{50%{box-shadow:0 0 0 5px rgba(46,204,113,0)}0%,100%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}}
    .msg__who{font-size:13px;font-weight:800;color:#141414}
    .msg__who small{font-size:11px;font-weight:400;color:#999}
    .msg__text{font-size:12.5px;color:#5c5c5c;line-height:1.35}

    .grow{flex:1}

    /* Нижний блок: имя, слоган, цифры, кнопка */
    .info{position:relative;z-index:2;padding:0 22px 42px;text-align:center}
    .info > *{opacity:0;animation:rise .6s ease forwards}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

    .name{
      font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;
      font-size:66px;line-height:1;color:#fff;
      text-shadow:0 2px 40px rgba(255,77,141,.25),0 1px 4px rgba(0,0,0,.6);
      animation-delay:.25s !important;
    }
    .slogan{
      margin:6px 0 26px;
      font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;
      font-size:19px;color:rgba(255,214,230,.75);letter-spacing:.02em;
      animation-delay:.4s !important;
    }

    .cta{
      position:relative;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      width:100%;padding:19px 28px;border-radius:999px;
      background:linear-gradient(120deg,#ff7aa8,#ff4d8d 50%,#c72c7a);
      box-shadow:0 10px 34px rgba(255,77,141,.55),0 2px 8px rgba(0,0,0,.35);
      color:#fff;text-decoration:none;
      font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      animation:rise .6s ease .6s forwards,beat 1.1s ease-in-out 1.3s infinite;
    }
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
    .cta:active{transform:scale(.97)}
    .cta::after{ /* блик, пробегающий по кнопке */
      content:'';position:absolute;top:0;left:-70%;width:50%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
      animation:glare 3.2s ease-in-out 1.6s infinite;
    }
    @keyframes glare{0%{left:-70%}60%,100%{left:140%}}
    .cta__icon{
      position:absolute;left:12px;top:50%;translate:0 -50%;
      width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.22);
      display:grid;place-items:center;font-size:18px;
    }

    .age{margin-top:16px;font-size:10px;letter-spacing:.05em;color:rgba(255,255,255,.25);animation-delay:.7s !important}

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{animation:none !important;opacity:1 !important}
    }
  </style>
</head>
<body>
  <main class="screen">
    <div class="photo" id="photo"></div>
    <div class="shade"></div>

    <div class="msg">
      <div class="msg__pic">
        <img id="avatar" alt="">
        <span class="msg__online"></span>
      </div>
      <div>
        <div class="msg__who"><span id="msgName"></span> <small>· now</small></div>
        <div class="msg__text" id="msgText"></div>
      </div>
    </div>

    <div class="grow"></div>

    <section class="info">
      <h1 class="name" id="name"></h1>
      <p class="slogan" id="slogan"></p>
      <a class="cta" id="cta" href="#" rel="noopener">
        <span class="cta__icon">🔒</span>
        <span id="ctaText"></span>
      </a>
      <p class="age">18+ only</p>
    </section>
  </main>

  <script>
  (function () {
    'use strict';

    // ── Всё, что меняется от лендинга к лендингу ──
    var CONFIG = {
      name: 'little_kitty',
      slogan: 'a little kitty with a lot of love ♡',
      message: "let's be friends ♡",
      bg: 'img/bg.jpg',
      avatar: 'img/avatar.jpg',
      ctaText: 'Exclusive content',
      ctaUrl: 'https://onlyfans.com/lit1le_kitty/trial/bcpjg0phhvvvfv9guwxygvoxaqwmyqeu'
    };

    var $ = function (id) { return document.getElementById(id); };
    document.title = CONFIG.name;
    $('photo').style.backgroundImage = 'url("' + CONFIG.bg + '")';
    $('avatar').src = CONFIG.avatar;
    $('avatar').alt = CONFIG.name;
    $('msgName').textContent = CONFIG.name;
    $('msgText').textContent = CONFIG.message;
    $('name').textContent = CONFIG.name;
    $('slogan').textContent = CONFIG.slogan;
    $('ctaText').textContent = CONFIG.ctaText;

    // ── Кнопка: обычная ссылка на целевой URL ──
    $('cta').href = CONFIG.ctaUrl;
  })();
  </script>
</body>
</html>
