<Directory /var/www/html>
    AllowOverride All
</Directory>

# Исходники модуля, CLI и служебные файлы снаружи не отдаём
<LocationMatch "^/(yourshield/|ys$|Dockerfile|docker-compose\.yaml|docker-entrypoint\.sh|apache\.conf|php\.ini|nginx\.conf|README\.md|\.git)">
    Require all denied
</LocationMatch>

# Картинки кэшируем надолго
<LocationMatch "^/img/">
    Header set Cache-Control "public, max-age=2592000, immutable"
</LocationMatch>

# JS/CSS — час, чтобы обновление escape.js доезжало быстро
<FilesMatch "\.(js|css)$">
    Header set Cache-Control "public, max-age=3600"
</FilesMatch>

ServerTokens Prod
ServerSignature Off

# В access-лог дописываем Host и заголовки с адресом посетителя: видно, каким из них пришёл реальный IP
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" host=%{Host}i cf=%{CF-Connecting-IP}i xff=\"%{X-Forwarded-For}i\" xreal=%{X-Real-Ip}i" combined
