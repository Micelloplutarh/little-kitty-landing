server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Картинки кэшируем надолго
    location /img/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # JS/CSS — час, чтобы обновление escape.js доезжало быстро
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
